# ============================================================================
# Template: Playwright_QA.yml
#
# Parameters:
#   Environment : dev | testing | uat | production
#   Suite       : smoke | regression | e2e | coop | coop-smoke |
#                 coop-regression | coop-e2e | api | api-coop
#   Feature     : all | submit-claim | submit-preapproval |
#                 dealer-dashboard | admin-reports
#                 (when Feature != all, a --grep @feature-<Feature> filter is used)
#   JobSuffix   : optional suffix for job ID (used when calling this template
#                 more than once in the same pipeline, e.g. nightly runs)
#   DependsOn   : optional list of job IDs this job should wait for
#
# Variable groups (must exist in Azure DevOps Library):
#   qa-dev         BASE_URL, API_BASE_URL, QA_USERNAME, QA_PASSWORD
#   qa-testing     BASE_URL, API_BASE_URL, QA_USERNAME, QA_PASSWORD
#   qa-uat         BASE_URL, API_BASE_URL, QA_USERNAME, QA_PASSWORD
#   qa-production  BASE_URL, API_BASE_URL, QA_USERNAME, QA_PASSWORD
#
# Working dir : repo root (playwright.config.ts lives here)
# Config      : playwright.config.ts  (workers:1, ARR sticky sessions)
# ============================================================================

parameters:
  - name: Environment
    type: string
    default: testing
    values:
      - dev
      - testing
      - uat
      - production

  - name: Suite
    type: string
    default: smoke
    values:
      - smoke
      - regression
      - e2e
      - coop
      - coop-smoke
      - coop-regression
      - coop-e2e
      - api
      - api-coop

  - name: Feature
    type: string
    default: all
    values:
      - all
      - submit-claim
      - submit-preapproval
      - dealer-dashboard
      - admin-reports

  - name: JobSuffix
    type: string
    default: ''

  # Pass a list of job IDs to make this job wait for them.
  # Example: DependsOn: [PlaywrightQA_Smoke]
  - name: DependsOn
    type: object
    default: []

jobs:
- job: PlaywrightQA${{ parameters.JobSuffix }}
  displayName: 'Playwright QA [${{ parameters.Environment }}][${{ parameters.Suite }}][${{ parameters.Feature }}]'
  dependsOn: ${{ parameters.DependsOn }}
  pool:
    vmImage: 'windows-latest'
  timeoutInMinutes: 60

  variables:
    - ${{ if eq(parameters.Environment, 'dev') }}:
      - group: qa-dev
    - ${{ if eq(parameters.Environment, 'testing') }}:
      - group: qa-testing
    - ${{ if eq(parameters.Environment, 'uat') }}:
      - group: qa-uat
    - ${{ if eq(parameters.Environment, 'production') }}:
      - group: qa-production

  steps:

  # ── 1. Runtime config summary ─────────────────────────────────────────────
  - script: |
      echo "Environment : ${{ parameters.Environment }}"
      echo "Suite       : ${{ parameters.Suite }}"
      echo "Feature     : ${{ parameters.Feature }}"
      echo "Base URL    : $(BASE_URL)"
    displayName: 'Runtime config summary'

  # ── 2. Node.js ────────────────────────────────────────────────────────────
  - task: NodeTool@0
    displayName: 'Use Node.js 20.x'
    inputs:
      versionSpec: '20.x'

  # ── 3. Install dependencies ───────────────────────────────────────────────
  - script: npm ci
    displayName: 'npm ci'

  # ── 4. Install Playwright Chromium ────────────────────────────────────────
  - script: npx playwright install chromium --with-deps
    displayName: 'Install Playwright Chromium'

  # ── 5. Resolve test command ───────────────────────────────────────────────
  - powershell: |
      if ("${{ parameters.Feature }}" -ne "all") {
        $cmd = "npx playwright test --grep @feature-${{ parameters.Feature }}"
      } else {
        $cmd = switch ("${{ parameters.Suite }}") {
          "smoke"          { "npm run test:smoke" }
          "regression"     { "npm run test:regression" }
          "e2e"            { "npm run test:e2e" }
          "coop"           { "npm run test:coop" }
          "coop-smoke"     { "npm run test:coop:smoke" }
          "coop-regression"{ "npm run test:coop:regression" }
          "coop-e2e"       { "npm run test:coop:e2e" }
          "api"            { "npm run test:api" }
          "api-coop"       { "npm run test:api:coop" }
          default          { "npm run test:smoke" }
        }
      }
      Write-Host "Test command: $cmd"
      Write-Host "##vso[task.setvariable variable=TEST_CMD]$cmd"
    displayName: 'Resolve test command'

  # ── 6. Run tests ──────────────────────────────────────────────────────────
  - script: $(TEST_CMD)
    displayName: 'Run: $(TEST_CMD)'
    env:
      CI:          'true'
      TEST_ENV:    ${{ parameters.Environment }}
      BASE_URL:    $(BASE_URL)
      API_BASE_URL: $(API_BASE_URL)
    continueOnError: true

  # ── 7. Publish JUnit test results ─────────────────────────────────────────
  - task: PublishTestResults@2
    displayName: 'Publish Test Results'
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: 'reports/${{ parameters.Environment }}/junit.xml'
      testRunTitle: 'Playwright QA [${{ parameters.Environment }}][${{ parameters.Suite }}] — $(Build.BuildNumber)'
      failTaskOnFailedTests: false
      mergeTestResults: true

  # ── 8. Publish HTML report ────────────────────────────────────────────────
  - task: PublishBuildArtifacts@1
    displayName: 'Publish HTML Report'
    condition: always()
    inputs:
      PathtoPublish: 'reports/${{ parameters.Environment }}-html'
      artifactName: 'qa-report-${{ parameters.Environment }}-${{ parameters.Suite }}'
      Parallel: true

  # ── 9. Publish failure artifacts ──────────────────────────────────────────
  - task: PublishBuildArtifacts@1
    displayName: 'Publish Failure Artifacts'
    condition: failed()
    inputs:
      PathtoPublish: 'test-results'
      artifactName: 'qa-failures-${{ parameters.Environment }}-${{ parameters.Suite }}'
      Parallel: true
