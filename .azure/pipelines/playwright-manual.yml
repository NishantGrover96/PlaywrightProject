name: $(date:yyyyMMdd)$(rev:.r)

trigger: none
pr: none

# Manual run: Choose environment, suite, or a specific feature.
# Optionally configure email recipients via the smtp-credentials variable group.
# Go to Pipelines → playwright-manual → Run pipeline.

parameters:

  - name: Environment
    displayName: Target Environment
    type: string
    default: testing
    values:
      - dev
      - testing
      - uat
      - production

  - name: Suite
    displayName: Test Suite (ignored when Feature != all)
    type: string
    default: smoke
    values:
      - smoke
      - regression
      - e2e
      - coop
      - coop-smoke
      - coop-regression
      - coop-e2e
      - api
      - api-coop

  - name: Feature
    displayName: Feature (overrides Suite when set)
    type: string
    default: all
    values:
      - all
      - submit-claim
      - submit-preapproval
      - dealer-dashboard
      - admin-reports

jobs:

# ── Job 1: Run Playwright tests ───────────────────────────────────────────────
- template: templates/Playwright_QA.yml
  parameters:
    Environment: ${{ parameters.Environment }}
    Suite: ${{ parameters.Suite }}
    Feature: ${{ parameters.Feature }}

# ── Job 2: Email results ──────────────────────────────────────────────────────
# Runs always (pass or fail) after the test job.
# SMTP credentials must be set in the 'smtp-credentials' variable group:
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM, SMTP_TO
- job: NotifyResults
  displayName: 'Email test results'
  dependsOn: PlaywrightQA
  condition: always()
  pool:
    vmImage: 'windows-latest'

  variables:
    - group: smtp-credentials
    - name: JOB_RESULT
      value: $[ dependencies.PlaywrightQA.result ]

  steps:
  - powershell: |
      $jobResult   = "$(JOB_RESULT)"
      $icon        = if ($jobResult -eq "Succeeded") { "✅" } else { "❌" }
      $buildUrl    = "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
      $testUrl     = "${buildUrl}&view=ms.vss-test-web.build-test-results-tab"
      $artUrl      = "${buildUrl}&view=artifacts"
      $statusColor = if ($jobResult -eq "Succeeded") { "#2e7d32" } elseif ($jobResult -eq "SucceededWithIssues") { "#e65100" } else { "#c62828" }
      $body  = "<!DOCTYPE html><html><body style='margin:0;padding:0;background:#f4f6f8;font-family:Segoe UI,Arial,sans-serif;'>"
      $body += "<div style='max-width:600px;margin:32px auto;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1);'>"
      $body += "<div style='background:#1565c0;padding:24px 32px;'>"
      $body += "<h2 style='margin:0;color:#fff;font-size:20px;'>$icon DealerPlatform QA Test Results</h2>"
      $body += "<p style='margin:6px 0 0;color:#bbdefb;font-size:13px;'>Build $(Build.BuildNumber) &nbsp;·&nbsp; Triggered by $(Build.RequestedFor)</p>"
      $body += "</div>"
      $body += "<div style='padding:24px 32px;'>"
      $body += "<table style='width:100%;border-collapse:collapse;font-size:14px;'>"
      $body += "<tr style='background:#e3f2fd;'><td style='padding:10px 14px;font-weight:600;width:140px;'>Environment</td><td style='padding:10px 14px;'>${{ parameters.Environment }}</td></tr>"
      $body += "<tr><td style='padding:10px 14px;font-weight:600;'>Suite</td><td style='padding:10px 14px;'>${{ parameters.Suite }}</td></tr>"
      $body += "<tr style='background:#e3f2fd;'><td style='padding:10px 14px;font-weight:600;'>Feature</td><td style='padding:10px 14px;'>${{ parameters.Feature }}</td></tr>"
      $body += "<tr><td style='padding:10px 14px;font-weight:600;'>Status</td><td style='padding:10px 14px;'><span style='background:${statusColor};color:#fff;padding:3px 10px;border-radius:4px;font-size:13px;'>$jobResult</span></td></tr>"
      $body += "</table>"
      $body += "<div style='margin-top:24px;'>"
      $body += "<a href='$testUrl' style='display:inline-block;padding:10px 20px;background:#1565c0;color:#fff;text-decoration:none;border-radius:5px;font-size:13px;margin-right:10px;'>📋 Test Results</a>"
      $body += "<a href='$artUrl' style='display:inline-block;padding:10px 20px;background:#424242;color:#fff;text-decoration:none;border-radius:5px;font-size:13px;'>📦 Artifacts &amp; Report</a>"
      $body += "</div></div>"
      $body += "<div style='background:#f4f6f8;padding:12px 32px;font-size:11px;color:#999;text-align:center;'>This is an automated message from Azure DevOps · DealerPlatform QA Pipeline</div>"
      $body += "</div></body></html>"
      Write-Host "##vso[task.setvariable variable=EMAIL_BODY]$body"
      $subject = "$icon DealerPlatform QA [${{ parameters.Environment }}][${{ parameters.Suite }}] - $jobResult"
      Write-Host "##vso[task.setvariable variable=EMAIL_SUBJECT]$subject"
      $to = "$(SMTP_TO)" -replace ',', ';'
      Write-Host "##vso[task.setvariable variable=EMAIL_TO]$to"
    displayName: 'Build email content'

  - task: SendEmail@2
    displayName: 'Send results email'
    inputs:
      To: $(EMAIL_TO)
      From: $(SMTP_FROM)
      Subject: $(EMAIL_SUBJECT)
      Body: $(EMAIL_BODY)
      SmtpServer: $(SMTP_HOST)
      SmtpPort: $(SMTP_PORT)
      LoginName: $(SMTP_USER)
      LoginPassword: $(SMTP_PASS)
      BodyAsHtml: true
      UseSSL: false
