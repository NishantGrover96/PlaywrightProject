<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Functional Unit Catalog</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous" defer></script>
</head>
<body class="bg-light">
<div class="bg-primary text-white px-4 py-3">
  <h1 class="h4 mb-0">Dashboard</h1>
</div>
<div class="container-fluid px-4 py-4">
  <div class="alert alert-warning" role="alert">
    <strong>Catalog Not Yet Generated</strong> &mdash; Run the <strong>functional-test-catalog</strong> Copilot skill to populate this file.
  </div>
  <div class="card">
    <div class="card-body">
      <dl class="row mb-0">
        <dt class="col-sm-3">Module</dt>  <dd class="col-sm-9"><code>rebate</code></dd>
        <dt class="col-sm-3">Feature</dt> <dd class="col-sm-9"><code>dashboard</code></dd>
        <dt class="col-sm-3">Client</dt>  <dd class="col-sm-9"><code>demoportal</code></dd>
        <dt class="col-sm-3">Command</dt> <dd class="col-sm-9"><code>@workspace generate functional test catalog for client=demoportal module=rebate feature=dashboard</code></dd>
      </dl>
    </div>
  </div>
</div>
</body>
</html>
