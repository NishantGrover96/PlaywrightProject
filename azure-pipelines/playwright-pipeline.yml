# Manual trigger only - no automatic triggers
trigger: none

# Disable PR triggers to avoid duplicate runs
pr: none

parameters:
- name: client
  displayName: 'Select Client'
  type: string
  default: 'demo'
  values:
    - demo
    - hankook

- name: environment
  displayName: 'Select Environment'
  type: string
  default: 'uat'
  values:
    - dev
    - uat
    - test
    - prod
    - verified

- name: testSuite
  displayName: 'Test Suite'
  type: string
  default: 'smoke'
  values:
    - all
    - smoke
    - regression
    - e2e

- name: browser
  displayName: 'Browser'
  type: string
  default: 'chrome'
  values:
    - chrome
    - firefox
    - webkit
    - all

- name: workers
  displayName: 'Parallel Workers'
  type: number
  default: 2
  values:
    - 1
    - 2
    - 4

variables:
  client: ${{ parameters.client }}
  environment: ${{ parameters.environment }}
  testSuite: ${{ parameters.testSuite }}
  browser: ${{ parameters.browser }}
  workers: ${{ parameters.workers }}
  # Build versioning
  buildVersion: '$(Build.BuildNumber)'
  artifactName: 'playwright-results-$(client)-$(environment)-$(buildVersion)'

jobs:
- job: ValidateEnvironment
  displayName: 'Validate Environment & Prerequisites'
  pool:
    vmImage: 'ubuntu-latest'
  
  steps:
  - script: |
      echo "🔍 Validating Configuration"
      echo "Client: $(client)"
      echo "Environment: $(environment)"
      echo "Test Suite: $(testSuite)"
      echo "Browser: $(browser)"
      echo "Workers: $(workers)"
      
      # Validate config file exists
      CONFIG_FILE="configs/environments/playwright.config.$(environment).ts"
      if [ ! -f "$CONFIG_FILE" ]; then
        echo "❌ Error: Config file $CONFIG_FILE not found!"
        exit 1
      fi
      echo "✅ Config file found: $CONFIG_FILE"
      
      # Validate client in config
      if ! grep -q "$(client)" configs/clients/client-modules-access.ts; then
        echo "❌ Error: Client '$(client)' not found in client-modules-access.ts"
        exit 1
      fi
      echo "✅ Client '$(client)' validated"
    displayName: 'Validate Configuration'

- job: RunPlaywrightTests
  displayName: 'Playwright Tests - $(client) - $(environment)'
  dependsOn: ValidateEnvironment
  pool:
    vmImage: 'ubuntu-latest'
  timeoutInMinutes: 60
  
  steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '18.x'
    displayName: 'Install Node.js'

  - task: Cache@2
    inputs:
      key: 'npm | "$(Agent.OS)" | package.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
        npm
      path: ~/.npm
    displayName: 'Cache npm dependencies'
    continueOnError: true

  - script: |
      # Check what package manager files exist
      echo "📦 Checking package manager files..."
      ls -la package*.json || echo "No package files found"
      
      # Install dependencies with appropriate command
      if [ -f "package-lock.json" ]; then
        echo "Using npm ci (package-lock.json found)"
        npm ci --prefer-offline --no-audit
      elif [ -f "yarn.lock" ]; then
        echo "Using yarn install (yarn.lock found)"
        yarn install --frozen-lockfile
      else
        echo "Using npm install (no lock file found)"
        npm install --prefer-offline --no-audit
      fi
    displayName: 'Install Dependencies'

  - script: |
      npx playwright install --with-deps
    displayName: 'Install Playwright Browsers'

  - script: |
      echo "📁 Creating output directories..."
      mkdir -p test-results
      mkdir -p playwright-report
      echo "✅ Directories created"
    displayName: 'Prepare Output Directories'

  - script: |
      echo "🚀 Running Playwright Tests"
      echo "Client: $(client)"
      echo "Environment: $(environment)" 
      echo "Test Suite: $(testSuite)"
      echo "Browser: $(browser)"
      echo "Workers: $(workers)"
      
      # Set environment variables for Playwright
      export CLIENT=$(client)
      export ENV=$(environment)
      export CI=true
      
      # Use the appropriate environment config
      CONFIG_FILE="configs/environments/playwright.config.$(environment).ts"
      
      # Build test command based on test suite
      case "$(testSuite)" in
        "smoke")
          TEST_PATH="tests/smoke/"
          ;;
        "regression") 
          TEST_PATH="tests/regression/"
          ;;
        "e2e")
          TEST_PATH="tests/e2e/"
          ;;
        "all")
          TEST_PATH=""
          ;;
        *)
          TEST_PATH="tests/$(testSuite)/"
          ;;
      esac
      
      # Build project filter based on browser and client
      if [ "$(browser)" = "all" ]; then
        if [ "$(testSuite)" = "smoke" ]; then
          # For smoke tests, run on all browsers
          PROJECT_FILTER="--project=$(client)-chrome --project=$(client)-firefox --project=$(client)-webkit"
        else
          # For full tests, run on chrome only
          PROJECT_FILTER="--project=$(client)-chrome"
        fi
      else
        PROJECT_FILTER="--project=$(client)-$(browser)"
      fi
      
      # Run Playwright tests with the environment-specific config
      npx playwright test $TEST_PATH \
        --config=$CONFIG_FILE \
        $PROJECT_FILTER \
        --workers=$(workers) \
        --reporter=html,junit,json \
        --timeout=90000 \
        --max-failures=10
      
      # Move reports to expected locations
      if [ -d "playwright-report" ] && [ ! -d "playwright-report/index.html" ]; then
        echo "✅ HTML report already in correct location"
      fi
      
      # Ensure junit results are in test-results directory
      if [ -f "results.xml" ]; then
        mkdir -p test-results
        mv results.xml test-results/junit-results.xml
        echo "✅ Moved JUnit results to test-results/"
      fi
      
      # Ensure json results are in test-results directory  
      if [ -f "results.json" ]; then
        mkdir -p test-results
        mv results.json test-results/results.json
        echo "✅ Moved JSON results to test-results/"
      fi
    displayName: 'Execute Playwright Tests'
    env:
      CLIENT: $(client)
      ENV: $(environment)
      CI: true
    continueOnError: true

  - script: |
      echo "📁 Checking output directories..."
      ls -la || true
      echo "Test results directory:"
      ls -la test-results/ || echo "test-results directory not found"
      echo "Playwright report directory:"
      ls -la playwright-report/ || echo "playwright-report directory not found"
      
      # Create missing directories if tests ran but directories don't exist
      if [ ! -d "playwright-report" ]; then
        echo "🔧 Creating placeholder playwright-report directory..."
        mkdir -p playwright-report
        echo "<html><body><h1>No HTML report generated</h1><p>Tests may not have run or failed to generate report.</p></body></html>" > playwright-report/index.html
      fi
      
      if [ ! -d "test-results" ]; then
        echo "🔧 Creating placeholder test-results directory..."
        mkdir -p test-results
        echo "{\"suites\": [], \"errors\": []}" > test-results/results.json
      fi
    displayName: 'Debug: Check Output Directories'
    condition: always()

  - task: PublishTestResults@2
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/junit-results.xml'
      testRunTitle: 'Playwright Tests - $(client) - $(environment) - $(testSuite) - $(buildVersion)'
      mergeTestResults: true
      failTaskOnFailedTests: false
    condition: always()
    displayName: 'Publish Test Results'

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: 'playwright-report'
      artifact: 'html-report-$(client)-$(environment)-$(buildVersion)'
      publishLocation: 'pipeline'
    condition: always()
    displayName: 'Publish HTML Report as Artifact'

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: 'test-results'
      artifact: '$(artifactName)'
      publishLocation: 'pipeline'
    condition: always()
    displayName: 'Upload Test Artifacts'

  - script: |
      echo "📊 Test Execution Summary"
      echo "Client: $(client)"
      echo "Environment: $(environment)"
      echo "Test Suite: $(testSuite)"
      echo "Browser: $(browser)"
      echo "Workers: $(workers)"
      echo "Config Used: configs/environments/playwright.config.$(environment).ts"
      echo "Build Version: $(buildVersion)"
      
      # Check if test results exist
      if [ -d "test-results" ]; then
        echo "✅ Test results directory found"
        find test-results -type f -name "*.json" | head -5 || echo "No JSON results found"
      else
        echo "❌ Test results directory not found"
      fi
      
      # Check if HTML report exists
      if [ -d "playwright-report" ]; then
        echo "✅ HTML report directory found"
      else
        echo "❌ HTML report directory not found"
      fi
    displayName: 'Test Summary & Validation'
    condition: always()