name: Playwright Tests

on:
  push:
    branches: [main]

jobs:
  test:
    name: Run Playwright tests
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      TEST_ENV: UAT
      CI: true
      # Scopes the run to samsung's own projects only. Without this, Playwright
      # fans out across every discovered client's setup project (browser-kind
      # projects in playwright.config.ts aren't scoped per client/spec folder),
      # so a single-file run still requires every other client's credentials.
      CLIENT_ID: samsung
      SAMSUNG_DEALER_EMAIL: ${{ secrets.SAMSUNG_DEALER_EMAIL }}
      SAMSUNG_DEALER_PASSWORD: ${{ secrets.SAMSUNG_DEALER_PASSWORD }}
      SAMSUNG_ADMIN_EMAIL: ${{ secrets.SAMSUNG_ADMIN_EMAIL }}
      SAMSUNG_ADMIN_PASSWORD: ${{ secrets.SAMSUNG_ADMIN_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        id: run_tests
        run: npx playwright test tests/playwright/specs/samsung/spiff/feature-spiff/spiff.spec.ts

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/${{ env.CLIENT_ID }}-${{ env.TEST_ENV }}-html/
          retention-days: 30
          if-no-files-found: warn

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1