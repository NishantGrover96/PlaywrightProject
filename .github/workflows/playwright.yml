name: Playwright Tests

on:
  push:
    branches: [main]

jobs:
  test:
    name: Run Playwright tests
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      # Must stay lowercase - matches .env.uat and the EnvironmentName type
      # in playwright.config.ts. Uppercase silently fails to load that file
      # on a case-sensitive Linux runner. UAT (not production) is deliberate:
      # production is the real, live Samsung HVAC site - never run tests there.
      TEST_ENV: uat
      CI: true
      # Scopes the run to samsung's own projects only. Without this, Playwright
      # fans out across every discovered client's setup project (browser-kind
      # projects in playwright.config.ts aren't scoped per client/spec folder),
      # so a single-file run still requires every other client's credentials.
      CLIENT_ID: samsung
      # Explicit, not left to .env.uat - that shared file's BASE_URL points at
      # DemoPortal, not Samsung (it's not scoped per client).
      BASE_URL: https://samsungportaluat.channel-fusion.com
      SAMSUNG_DEALER_EMAIL: ${{ secrets.SAMSUNG_DEALER_EMAIL }}
      SAMSUNG_DEALER_PASSWORD: ${{ secrets.SAMSUNG_DEALER_PASSWORD }}
      SAMSUNG_ADMIN_EMAIL: ${{ secrets.SAMSUNG_ADMIN_EMAIL }}
      SAMSUNG_ADMIN_PASSWORD: ${{ secrets.SAMSUNG_ADMIN_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Create placeholder auth storage state
        # The "chromium" project's config still points at
        # tests/playwright/fixtures/.auth/user.json (only ever created by the
        # "setup" project, which --no-deps below intentionally skips). SPIFF
        # tests don't use this saved session at all (they log in inline via
        # loginAsSpiffUser), so an empty state just satisfies Playwright's
        # requirement that the file exist.
        run: |
          mkdir -p tests/playwright/fixtures/.auth
          echo '{"cookies":[],"origins":[]}' > tests/playwright/fixtures/.auth/user.json

      - name: Run Playwright tests
        id: run_tests
        # --project=chromium: samsung is a "legacy-shared" client, so its
        # dealer-role project is just named "chromium" (shared across all
        # legacy clients) - CLIENT_ID above scopes it to samsung specifically.
        # --no-deps: spiff.spec.ts logs in inline per test (loginAsSpiffUser)
        # and never uses a saved storageState, so the "setup"/"setup-admin"
        # dependency (a generic bootstrap script shared with demoportal/
        # certainteed that navigates to /CoopManagement/Dashboard) is not
        # needed here and would otherwise gate the whole run on unrelated
        # credentials/behavior.
        run: npx playwright test tests/playwright/specs/samsung/spiff/feature-spiff/spiff.spec.ts --project=chromium --no-deps

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/${{ env.CLIENT_ID }}-${{ env.TEST_ENV }}-html/
          retention-days: 30
          if-no-files-found: warn

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1